sources:
- id: pokemon_official_products
  name: ポケモンカードゲーム公式 商品情報
  operator: 株式会社ポケモン
  service_name: ポケモンカードゲーム トレーナーズウェブサイト
  source_type: official_product_catalog
  source_tier: official
  coverage_scope: specialized
  supported_games:
    pokemon_card: verified
  purposes:
  - release_discovery
  classification: stable
  enabled: true
  discovery_urls:
  - https://www.pokemon-card.com/products/resultAPI.php?productType=expansion
  - https://www.pokemon-card.com/products/index.html?productType=expansion
  - https://www.pokemon-card.com/products/
  - https://www.pokemon-card.com/info/
  page_url_patterns:
  - ^https://www\.pokemon-card\.com/products/.+
  - ^https://www\.pokemon-card\.com/info/.+
  include_keywords:
  - 拡張パック
  - 強化拡張パック
  - ハイクラスパック
  - 再拡張パック
  exclude_keywords:
  - スターターセット
  - デッキ
  - スペシャルセット
  - 周辺グッズ
  product_keywords:
  - 拡張パック
  - 強化拡張パック
  - ハイクラスパック
  - 再拡張パック
  lottery_keywords: []
  start_labels: []
  release_labels:
  - 販売日
  - 発売日
  selectors:
    product_cards:
    - main article
    - main li
    - '[class*="product"]'
    title:
    - h1
    - h2
    - h3
    - '[class*="title"]'
    release_date:
    - time
    - '[class*="date"]'
    links:
    - a[href*="/products/"]
  date_patterns:
  - (?P<year>20\d{2})年(?P<month>\d{1,2})月(?P<day>\d{1,2})日
  render_mode: http_then_playwright_if_empty
  render_wait_selector: .product-card
  parser_strategy: pokemon_official_product_cards
  fallback_strategy: label_scoped_release_parser_then_snkrdunk
  fallback_source_ids:
  - snkrdunk_pokemon
  expected_elements:
  - product_name
  - product_category
  - release_date
  - product_link
  alert_conditions:
  - new_box_product_without_exact_release_date
  - expected_element_missing
  - structure_changed
  - repeated_http_error
  - login_or_error_replacement
  - implausible_release_date
  poll_minutes: 120
  notes: 公式検索APIを優先し、正常な商品0件と取得障害を区別する。API障害時は公式商品ページへ切り替える。発売日は最優先の一次情報。日付変更時は同じrelease_idのカレンダー予定を更新する。
