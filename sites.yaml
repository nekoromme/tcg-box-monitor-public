  name: tcg-box-lottery-monitor
  user_agent: "TCGBoxLotteryMonitor/2.0 (+repository contact URL)"
  request_timeout_seconds: 20
  request_budget_seconds: 60
  max_retries: 2
  retry_backoff_seconds: [0, 0]
  max_parallel_hosts: 6
  minimum_host_interval_seconds: 5
  # 本文・一覧で発見した詳細URLをキャッシュしていないため、304では再解析や
  # 詳細ページ/OCRの再試行が消える。本文キャッシュ実装までは毎回本文を取得する。
  conditional_get: false
  # GitHub Actionsの各定期実行で全監視先を同時に評価する。
  # 現行スケジュールの最短間隔が120分なので、全sourceを120分へ統一する。
  normal_poll_minutes: 120
  secondary_poll_minutes: 120
  discovery_poll_hours: 2
  health_poll_minutes: 120
  uniform_source_poll_minutes: 120
  general_retail_required_game_ids:
    - pokemon_card
    - one_piece_card
    - dragon_ball_fusion_world
    - lorcana
    - yu_gi_oh
    - gundam_card
  max_future_days: 365
  implausible_past_days: 45
  # 開始日を取れないSNS投稿に「初回検出日」を使えるのは、
  # 投稿から7日以内だけ。店固有の形式はsource単位で上書きできる。
  detection_fallback_max_age_days: 7
  structure_similarity_warning_threshold: 0.55
  consecutive_http_error_threshold: 2
  unresolved_alert_reminder_hours: 0  # 0: 同じ異常は解消するまで再通知しない
  initial_baseline:
    notify_existing_lotteries: false
    create_calendar_for_existing_lotteries: false
    notify_future_releases: true
    create_calendar_for_future_releases: true
  calendar:
    timezone: Asia/Tokyo
    lottery_timed_event_duration_minutes: 15
    exact_date_without_time_policy: all_day
    month_only_release_policy: alert_only
    ambiguous_date_policy: alert_only
  precedence:
    - official
    - official_indirect
    - secondary

games:
  pokemon_card:
    name: ポケモンカードゲーム
    short_name: ポケカ
    release_notification_prefix: "【ポケカ新弾発売日】"
    release_calendar_prefix: "【ポケカ発売】"
    lottery_schedule_prefix: "【ポケカ抽選予定】"
    lottery_start_prefix: "【ポケカ抽選開始】"
    include_keywords:
      - ポケモンカードゲーム
      - ポケモンカード
      - ポケカ
    box_product_keywords:
      - 拡張パック
      - 強化拡張パック
      - ハイクラスパック
      - 再拡張パック
    box_evidence_patterns:
      - '(?i)\b1?BOX\b'
      - '1BOX[＝=：:]?\s*\d+パック'
      - '(拡張パック|強化拡張パック).{0,50}(30パック|1BOX)'
      - 'ハイクラスパック.{0,50}(10パック|1BOX)'
    product_exclude_keywords:
      - スターターセット
      - スターターデッキ
      - スタートデッキ
      - 構築済みデッキ
      - デッキセット
      - スペシャルセット
      - カードセット
      - ポケモンセンターセット
      - プレミアムトレーナーボックス
      - デッキシールド
      - デッキケース
      - カードファイル
      - プレイマット
      - サプライ
      - 周辺用品
      - キャンペーン
      - 大会
    # 指定商品だけ抽選・予約・受注・販売開始を拾う。falseで停止。
    # required_keywordsはどれか1つ必須、exclude_keywordsは1つでもあれば除外。
    # selected_variants: []は全種類。根拠・見送り理由はdocs/non-box-opportunities-2026-10-02.md。
