      - id: pokemon_30th_cardset
        enabled: true
        name: 30th CELEBRATION カードセット
        category: カードセット
        aliases:
          - 30thカードセット
          - 30thセレブレーションカードセット
          - 30周年カードセット
          - 30th CEREBRATION カードセット
        selected_variants: []
        variants:
          - フシギダネ・ヒトカゲ・ゼニガメ
          - チコリータ・ヒノアラシ・ワニノコ
          - キモリ・アチャモ・ミズゴロウ
          - ナエトル・ヒコザル・ポッチャマ
          - ツタージャ・ポカブ・ミジュマル
          - ハリマロン・フォッコ・ケロマツ
          - モクロー・ニャビー・アシマリ
          - サルノリ・ヒバニー・メッソン
          - ニャオハ・ホゲータ・クワッス
        note: 追加販売・受注で供給が増える可能性あり。各発送回の相場と送料を確認。
      # デッキセット全般は除外したまま、この商品だけ抽選監視へ追加する。
      - id: pokemon_30th_premium_deck
        enabled: true
        name: 30th CELEBRATION プレミアムデッキセット エーフィ・ブラッキー
        category: プレミアムデッキセット
        aliases:
          - プレミアムデッキセット エーフィ・ブラッキー
          - プレミアムデッキセット エーフィー・ブラッキー
          - 30th CELEBRATION プレミアムデッキセット
          - 30th CEREBRATION プレミアムデッキセット
          - 30thセレブレーションプレミアムデッキセット
          - 30周年プレミアムデッキセット
        selected_variants: []
        variants: []
        note: 追加販売・受注で供給が増える可能性あり。各発送回の相場と送料を確認。
      - id: pokemon_30th_futuristic_box
        name: 30th CELEBRATION FUTURISTIC BOX
        category: 特別セット
        aliases: [FUTURISTIC BOX, フューチャリスティックBOX]
        note: 定価27,500円。ピカチュウFUR入り。後日の店頭販売の可能性が公式に明記されている。
      - id: pokemon_special_box_tohoku
        name: スペシャルBOX ポケモンセンタートウホク
        category: 地域限定プロモセット
        aliases: [ポケモンセンタートウホク, ポケセントウホク, トウホクのスペシャルBOX]
        required_keywords: [スペシャルBOX, スペシャルボックス]
        note: 定価2,090円。公式が追加生産・追加販売を発表済み。未開封状態と発送時の相場を確認。
      - id: pokemon_special_box_hiroshima
        name: スペシャルBOX ポケモンセンターヒロシマ
        category: 地域限定プロモセット
        aliases: [ポケモンセンターヒロシマ, ポケセンヒロシマ, ヒロシマのスペシャルBOX]
        required_keywords: [スペシャルBOX, スペシャルボックス]
        note: 定価2,090円。公式が追加生産・追加販売を発表済み。未開封状態と発送時の相場を確認。
      - id: pokemon_special_box_fukuoka
        name: スペシャルBOX ポケモンセンターフクオカ
        category: 地域限定プロモセット
        aliases: [ポケモンセンターフクオカ, ポケセンフクオカ, フクオカのスペシャルBOX]
        required_keywords: [スペシャルBOX, スペシャルボックス]
        note: 定価2,090円。公式が追加生産・追加販売を発表済み。未開封状態と発送時の相場を確認。
      # 商品名が変わっても同じ系列を拾う。利益確定ではなく抽選の検討候補。
      - id: pokemon_center_set
        monitor_sales: false
        name: ポケモンセンターセット
        category: ポケモンセンターセット
        name_patterns:
          - '(?P<name>(?:拡張パック|強化拡張パック|ハイクラスパック)?\s*[「『][^」』\n]{2,70}[」』]\s*ポケモンセンターセット)'
          - '(?P<name>[\w・－ー]{2,60}\s+ポケモンセンターセット)'
          - '(?P<name>ポケモンセンターセット\s*[「『][^」』\n]{2,70}[」』])'
      - id: pokemon_center_special_box
        monitor_sales: false
        name: ポケモンセンター記念スペシャルBOX
        category: スペシャルBOX
        name_patterns:
          - '(?P<name>スペシャル\s*(?:BOX|ボックス)\s*[「『]?ポケモンセンター[ァ-ヶーA-Za-z0-9]+[」』]?)'
      - id: pokemon_anniversary_set
        monitor_sales: false
        name: 周年限定カード・デッキセット
