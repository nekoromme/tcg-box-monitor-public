[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-box-monitor"
version = "0.1.0"
description = "TCG BOX lottery and release monitor"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5", "PyYAML>=6", "google-api-python-client>=2", "google-auth>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "respx>=0.21", "freezegun>=1.5"]
browser = ["playwright>=1.45"]

[project.scripts]
tcg-monitor = "tcg_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
packages = ["tcg_monitor"]

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
