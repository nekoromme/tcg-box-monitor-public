name: Temporary ONE PIECE regression check
on:
  pull_request:
    paths:
      - 'src/tcg_monitor/parsers/onepiece_official.py'
      - 'sites.yaml'
      - 'tests/test_release_calendar.py'
      - '.github/workflows/onepiece-regression.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: tcg-monitor validate-config
      - run: ruff check src/tcg_monitor/parsers/onepiece_official.py tests/test_release_calendar.py
      - run: pytest tests/test_release_calendar.py -k 'onepiece or official_release_fixtures'
