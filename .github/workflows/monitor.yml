name: monitor
on:
  # 移行中は手動実行だけに限定する。Secrets設定と動作確認後に定期実行を有効化する。
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, baseline, arm, run]
        default: dry-run
      include_future_releases:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: monitor-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      # 監視コード側のcheckoutでは書き込み用資格情報を残さない。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate private state access
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          if [ -z "$STATE_REPO_TOKEN" ]; then
            echo "::error::Repository secret STATE_REPO_TOKEN is not set"
            exit 1
          fi
      - name: Show enabled games
        run: |
          echo "### 🎴 作品別監視" >> "$GITHUB_STEP_SUMMARY"
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' GAME_MONITOR_MODES.txt | while IFS='=' read -r GAME MODE; do
            echo "- ${GAME}: **${MODE}**" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Show Tohoku expedition mode
        run: |
          MODE="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' TOHOKU_EXPEDITION_MODE.txt | tail -n 1 | tr '[:lower:]' '[:upper:]')"
          echo "### 🚗 東北遠征モード: **${MODE}**" >> "$GITHUB_STEP_SUMMARY"
          echo "東北遠征モード: ${MODE}"
      - name: Check out persistent monitor state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nekopone/tcg-box-monitor
          ref: monitor-state
          path: .monitor-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[browser]'
      - name: Install Japanese OCR support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-jpn
          command -v tesseract
          tesseract --list-langs | grep -Fx jpn
      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium for JavaScript product catalog
        run: python -m playwright install --with-deps chromium
      - name: Validate secrets for live run
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'run' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          missing=0
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICE_ACCOUNT_JSON is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_CALENDAR_ID" ]; then
            echo "::error::Repository secret GOOGLE_CALENDAR_ID is not set"
            missing=1
          fi
          exit "$missing"
      - name: Validate Google secrets for release import
        if: ${{ inputs.mode == 'baseline' && inputs.include_future_releases == true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          missing=0
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICE_ACCOUNT_JSON is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_CALENDAR_ID" ]; then
            echo "::error::Repository secret GOOGLE_CALENDAR_ID is not set"
            missing=1
          fi
          exit "$missing"
      - name: Execute monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          # 個人メールをVariableへ置かず、公開しても困らないリポジトリURLを名乗る。
          MONITOR_USER_AGENT_CONTACT: https://github.com/${{ github.repository }}
        run: |
          MODE="${{ inputs.mode || 'run' }}"
          STATE=".monitor-state/monitor_state.json"
          if [ "$MODE" = "baseline" ] && [ "${{ inputs.include_future_releases }}" = "true" ]; then
            tcg-monitor --state "$STATE" baseline --include-future-releases
          else
            tcg-monitor --state "$STATE" "$MODE"
          fi
      - name: Persist monitor state
        if: ${{ always() && hashFiles('.monitor-state/monitor_state.json') != '' }}
        working-directory: .monitor-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f monitor_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update monitor state [skip ci]"
          git push origin HEAD:monitor-state
      - name: Publish monitor summary
        if: ${{ always() && hashFiles('.monitor-state/monitor_state.json') != '' }}
        run: tcg-monitor --state .monitor-state/monitor_state.json summary
