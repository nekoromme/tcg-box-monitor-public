name: monitor

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'sites.yaml'
      - 'GAME_MONITOR_MODES.txt'
      - '.github/workflows/monitor.yml'
  schedule:
    # UTC指定。日本時間では06:04、11:04、16:04、18:04、20:04、22:04。
    - cron: '4 2,7,9,11,13,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, baseline, arm, run]
        default: dry-run
      include_future_releases:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show enabled games
        run: |
          echo "### 🎴 作品別監視" >> "$GITHUB_STEP_SUMMARY"
          sed -e 's/#.*//' -e '/^[[:space:]]*$/d' GAME_MONITOR_MODES.txt | while IFS='=' read -r GAME MODE; do
            echo "- ${GAME}: **${MODE}**" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Check out monitor state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: monitor-state
          path: .monitor-state
          token: ${{ github.token }}
          persist-credentials: true

      - name: Use monitor state
        run: |
          STATE_PATH="$GITHUB_WORKSPACE/.monitor-state/monitor_state.json"
          if [ ! -f "$STATE_PATH" ]; then
            echo "::error::monitor-state branch does not contain monitor_state.json"
            exit 1
          fi
          echo "MONITOR_STATE_PATH=$STATE_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e '.[browser]'

      - name: Install Japanese OCR support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-jpn
          command -v tesseract
          tesseract --list-langs | grep -Fx jpn

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium for JavaScript product catalog
        run: python -m playwright install --with-deps chromium

      - name: Validate secrets for live run
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'run' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          missing=0
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICE_ACCOUNT_JSON is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_CALENDAR_ID" ]; then
            echo "::error::Repository secret GOOGLE_CALENDAR_ID is not set"
            missing=1
          fi
          exit "$missing"

      - name: Validate Google secrets for release import
        if: ${{ inputs.mode == 'baseline' && inputs.include_future_releases == true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          missing=0
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICE_ACCOUNT_JSON is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_CALENDAR_ID" ]; then
            echo "::error::Repository secret GOOGLE_CALENDAR_ID is not set"
            missing=1
          fi
          exit "$missing"

      - name: Execute monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          MONITOR_USER_AGENT_CONTACT: https://github.com/${{ github.repository }}
        run: |
          MODE="${{ inputs.mode || 'run' }}"
          set +e
          if [ "$MODE" = "baseline" ] && [ "${{ inputs.include_future_releases }}" = "true" ]; then
            tcg-monitor --state "$MONITOR_STATE_PATH" baseline --include-future-releases
          else
            tcg-monitor --state "$MONITOR_STATE_PATH" "$MODE"
          fi
          MONITOR_STATUS=$?
          tcg-monitor --state "$MONITOR_STATE_PATH" summary
          SUMMARY_STATUS=$?
          set -e
          if [ "$MONITOR_STATUS" -ne 0 ]; then
            exit "$MONITOR_STATUS"
          fi
          exit "$SUMMARY_STATUS"

      - name: Persist monitor state
        if: ${{ always() && env.MONITOR_STATE_PATH != '' }}
        working-directory: .monitor-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f monitor_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update monitor state [skip ci]"
          git push origin HEAD:monitor-state
