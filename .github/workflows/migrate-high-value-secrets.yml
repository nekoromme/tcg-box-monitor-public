name: Migrate high-value monitor secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DESTINATION_REPO: nekoromme/high-value-lottery-monitor
      GH_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Validate source secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$DISCORD_WEBHOOK_URL"
          test -n "$GOOGLE_CALENDAR_ID"
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON"

      - name: Migrate encrypted secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DISCORD_WEBHOOK_URL" | gh secret set DISCORD_WEBHOOK_URL --repo "$DESTINATION_REPO"
          printf '%s' "$GOOGLE_CALENDAR_ID" | gh secret set GOOGLE_CALENDAR_ID --repo "$DESTINATION_REPO"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | gh secret set GOOGLE_SERVICE_ACCOUNT_JSON --repo "$DESTINATION_REPO"
          echo "3 repository secrets migrated without exposing values."
