name: fast opportunity monitor
on:
  # 定期巡回はmonitor.ymlへ統一する。この軽量版は障害調査時の手動実行専用。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate private state access
        env:
          STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
        run: |
          if [ -z "$STATE_REPO_TOKEN" ]; then
            echo "::error::Repository secret STATE_REPO_TOKEN is not set"
            exit 1
          fi
      - name: Check out persistent monitor state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nekopone/tcg-box-monitor
          ref: monitor-state
          path: .monitor-state
          token: ${{ secrets.STATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Install Japanese OCR support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-jpn
          command -v tesseract
          tesseract --list-langs | grep -Fx jpn
      - name: Validate live-run secrets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          missing=0
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Repository secret DISCORD_WEBHOOK_URL is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICE_ACCOUNT_JSON is not set"
            missing=1
          fi
          if [ -z "$GOOGLE_CALENDAR_ID" ]; then
            echo "::error::Repository secret GOOGLE_CALENDAR_ID is not set"
            missing=1
          fi
          exit "$missing"
      - name: Execute fast opportunity monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          MONITOR_USER_AGENT_CONTACT: https://github.com/${{ github.repository }}
        run: |
          tcg-monitor \
            --state .monitor-state/monitor_state.json \
            --source furuichi_official_lottery \
            --source yahoo_realtime_furuichi \
            --source snkrdunk_onepiece \
            run
      - name: Persist monitor state
        if: ${{ always() && hashFiles('.monitor-state/monitor_state.json') != '' }}
        working-directory: .monitor-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f monitor_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update monitor state [skip ci]"
          git push origin HEAD:monitor-state
      - name: Publish monitor summary
        if: ${{ always() && hashFiles('.monitor-state/monitor_state.json') != '' }}
        run: tcg-monitor --state .monitor-state/monitor_state.json summary
